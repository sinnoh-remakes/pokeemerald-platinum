name: Build

on:
  pull_request:
  push:
    branches: [master]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build ROM
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository }}-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache built host tools
        uses: actions/cache@v4
        with:
          path: tools
          key: tools-${{ hashFiles('tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h', 'tools/**/*.hpp', 'tools/**/Makefile') }}

      - name: Build ROM
        run: make -j"$(nproc)"

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald.gba
          path: pokeemerald.gba
          if-no-files-found: error
